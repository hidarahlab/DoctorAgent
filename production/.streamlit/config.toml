# Always use the light theme, regardless of the viewer's OS dark-mode setting
[theme]
base = "light"
primaryColor = "#12A39A"            # teal accent (buttons, links, focus)
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF6F5" # sidebar, expanders, chat input
textColor = "#1D2B2F"

[client]
# "developer" keeps "Clear cache" in the ⋮ menu even when the app is not on localhost;
# the other menu items and the Deploy button are hidden with CSS in app.py
toolbarMode = "developer"

[server]
# rerun automatically when a source file is saved, instead of showing the
# "File change. Rerun / Always rerun" banner
runOnSave = true

[browser]
gatherUsageStats = false
